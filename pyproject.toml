[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classificador-intencoes"
version = "0.1.0"
description = "Classificador de intenções de mensagens em português (MASSIVE pt-PT) com scikit-learn"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4", "pandas>=2.0", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
